<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>40LPAFOCUS — From Java Developer to ₹40 LPA Engineer</title>
<meta name="description" content="40LPAFOCUS: a browser-only interview preparation and job-search system for senior Java backend roles.">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='40' height='40' rx='10' fill='url(%23g)'/%3E%3Cpath d='M26 12.5L32 6.5M27.5 6.5H32V11' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ctext x='18' y='27' text-anchor='middle' font-family='Arial,sans-serif' font-weight='800' font-size='15' fill='white'%3E40%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
/* Apply saved theme before first paint to avoid a flash */
(function(){try{var d=JSON.parse(localStorage.getItem('40LPAFOCUS_v1')||'null');var t=d&&d.settings&&d.settings.theme;if(!t){t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
</script>
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<style>
:root{
  --bg:#f5f6fa;--surface:#ffffff;--surface-2:#f0f2f7;--surface-3:#e8ebf3;--border:#e1e5ee;--border-strong:#cfd5e2;
  --text:#121729;--text-2:#323a52;--muted:#636b82;--primary:#4f46e5;--primary-2:#7c3aed;--primary-soft:#eef0ff;--on-primary:#fff;
  --accent:#0891b2;--success:#15803d;--success-soft:#e7f6ec;--warning:#b45309;--warning-soft:#fdf3e2;--danger:#c81e1e;--danger-soft:#fdecec;
  --info-soft:#e6f6fa;--shadow-sm:0 1px 2px rgba(16,24,40,.06);--shadow:0 1px 3px rgba(16,24,40,.07),0 6px 18px -8px rgba(16,24,40,.12);
  --shadow-lg:0 24px 48px -12px rgba(16,24,40,.28);--radius:14px;--radius-sm:9px;--sidebar:262px;--mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --heat-0:#ebedf3;--heat-1:#c7d2fe;--heat-2:#818cf8;--heat-3:#6366f1;--heat-4:#4338ca;--code-bg:#0f1424;--code-text:#e3e8f7;
}
[data-theme="dark"]{
  --bg:#0a0d16;--surface:#111625;--surface-2:#171d30;--surface-3:#1f2740;--border:#232b42;--border-strong:#323c5a;
  --text:#e8ebf5;--text-2:#c4cadb;--muted:#959eb8;--primary:#8b93ff;--primary-2:#a78bfa;--primary-soft:#1e2147;--on-primary:#0b0e1a;
  --accent:#22d3ee;--success:#4ade80;--success-soft:#11281b;--warning:#fbbf24;--warning-soft:#2a210c;--danger:#f87171;--danger-soft:#2c1215;
  --info-soft:#0d2530;--shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -10px rgba(0,0,0,.6);--shadow-lg:0 24px 60px -12px rgba(0,0,0,.7);
  --heat-0:#1a2033;--heat-1:#2e3470;--heat-2:#4547a8;--heat-3:#6366f1;--heat-4:#a5b4fc;--code-bg:#070a13;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14.5px;line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.01em}
h1{font-size:1.55rem;font-weight:800}h2{font-size:1.1rem;font-weight:700}h3{font-size:.98rem;font-weight:650}h4{font-size:.9rem;font-weight:650}
p{margin:.35rem 0}a{color:var(--primary)}
code,pre,kbd{font-family:var(--mono)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
i[data-lucide]{font-style:normal;display:inline-flex;align-items:center;justify-content:center;line-height:1}
i[data-lucide]::before{content:attr(data-fb)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;z-index:200;background:var(--primary);color:var(--on-primary);padding:8px 12px;border-radius:8px}
.skip:focus{left:8px}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--border);padding:16px 12px 20px;display:flex;flex-direction:column;gap:6px;z-index:60}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 14px}
.brand svg{width:38px;height:38px;flex:none;filter:drop-shadow(0 4px 10px rgba(79,70,229,.35))}
.brand-name{font-weight:800;font-size:1.05rem;letter-spacing:.01em}
.brand-name span{background:linear-gradient(90deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-tag{font-size:.72rem;color:var(--muted);line-height:1.3}
.nav-group{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:12px 10px 4px;font-weight:700}
.nav-link{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--text-2);text-decoration:none;font-weight:500;font-size:.9rem;border:1px solid transparent}
.nav-link svg,.nav-link i{width:17px;height:17px;flex:none;opacity:.85}
.nav-link:hover{background:var(--surface-2);color:var(--text)}
.nav-link.active{background:var(--primary-soft);color:var(--primary);border-color:color-mix(in srgb,var(--primary) 22%,transparent);font-weight:650}
.sidebar-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--border);font-size:.75rem;color:var(--muted)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:10px 24px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.topbar-title{font-weight:700;font-size:.98rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-brand{display:none;align-items:center;gap:8px}
.topbar-brand svg{width:30px;height:30px}
.save-pill{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted);padding:4px 10px;border:1px solid var(--border);border-radius:99px;background:var(--surface);white-space:nowrap}
.save-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--success)}
.save-pill.err{color:var(--danger);border-color:var(--danger)}.save-pill.err .dot{background:var(--danger)}
.spacer{flex:1}
.content{padding:24px;max-width:1320px;width:100%;margin:0 auto}
.bottom-nav{display:none}
.scrim{display:none}

/* ---------- Components ---------- */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.page-head p{color:var(--muted);margin:.25rem 0 0;max-width:760px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:18px;min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-head h2,.card-head h3{display:flex;align-items:center;gap:8px}
.card-head svg{width:18px;height:18px;color:var(--primary)}
.muted{color:var(--muted)}.small{font-size:.82rem}.tiny{font-size:.74rem}.bold{font-weight:700}
.stat{display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.stat .label{font-size:.76rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:6px}
.stat .label svg{width:15px;height:15px}
.stat .value{font-size:1.65rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .sub{font-size:.8rem;color:var(--muted)}
.hero{background:linear-gradient(135deg,#3730a3 0%,#6d28d9 55%,#0e7490 100%);color:#fff;border:none;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%)}
.hero .muted{color:rgba(255,255,255,.8)}
.hero-row{display:flex;gap:22px;align-items:center;flex-wrap:wrap;position:relative;z-index:1}
.hero h1{font-size:1.6rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:.74rem;font-weight:600;background:var(--surface-2);color:var(--text-2);border:1px solid var(--border);white-space:nowrap}
.hero .chip{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.25);color:#fff}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:.72rem;font-weight:650;white-space:nowrap;background:var(--surface-2);color:var(--text-2)}
.b-easy,.b-success{background:var(--success-soft);color:var(--success)}
.b-medium,.b-warning{background:var(--warning-soft);color:var(--warning)}
.b-hard,.b-danger{background:var(--danger-soft);color:var(--danger)}
.b-primary{background:var(--primary-soft);color:var(--primary)}
.b-info{background:var(--info-soft);color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font:inherit;font-weight:600;font-size:.86rem;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,transform .05s;min-height:36px}
.btn svg{width:16px;height:16px}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn-primary:hover{background:color-mix(in srgb,var(--primary) 88%,#000)}
.btn-danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--border))}
.btn-danger:hover{background:var(--danger-soft)}
.btn-danger-solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-ghost{border-color:transparent;background:transparent}
.btn-sm{padding:5px 10px;font-size:.79rem;min-height:30px}
.btn-icon{padding:6px;min-width:34px;min-height:34px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hero .btn{background:rgba(255,255,255,.95);color:#2c2580;border-color:transparent}

/* Forms */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
label.fl{display:flex;flex-direction:column;gap:5px;font-size:.8rem;font-weight:600;color:var(--text-2);min-width:0}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border-strong);border-radius:9px;padding:8px 10px;min-height:38px;width:100%;min-width:0}
textarea{resize:vertical;min-height:80px;line-height:1.5}
input[type=checkbox],input[type=radio]{width:17px;height:17px;min-height:0;accent-color:var(--primary);flex:none;margin:0;cursor:pointer}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 22%,transparent)}
.invalid{border-color:var(--danger)!important}
.err-text{color:var(--danger);font-size:.76rem;font-weight:500}
.check{display:inline-flex;align-items:center;gap:8px;font-size:.86rem;cursor:pointer}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.toolbar>input[type=search],.toolbar .search{flex:1 1 220px}
.toolbar select{width:auto;flex:0 1 auto;max-width:100%}
.search{position:relative}
.search input{padding-left:34px}
.search svg,.search i{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
.tabs{display:flex;gap:4px;padding:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:none;background:none;font:inherit;font-weight:600;font-size:.84rem;color:var(--muted);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tab.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.tab .count{font-size:.7rem;background:var(--surface-3);padding:0 6px;border-radius:99px}

/* Lists & items */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface);min-width:0}
.item:hover{border-color:var(--border-strong)}
.item.done .item-title{text-decoration:line-through;color:var(--muted)}
.item-body{flex:1;min-width:0}
.item-title{font-weight:650;overflow-wrap:anywhere}
.item-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:4px;font-size:.78rem;color:var(--muted)}
.item-actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.date-group{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 2px 2px;display:flex;gap:8px;align-items:center}
.date-group:first-child{margin-top:0}
.pri-High{border-left:3px solid var(--danger)}.pri-Medium{border-left:3px solid var(--warning)}.pri-Low{border-left:3px solid var(--accent)}
.empty{text-align:center;padding:34px 16px;color:var(--muted);border:1.5px dashed var(--border-strong);border-radius:14px}
.empty svg{width:34px;height:34px;color:var(--primary);opacity:.7;margin-bottom:6px}
.empty h3{color:var(--text);margin-bottom:4px}
.progress{height:8px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.progress>span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .4s}
.ring{flex:none}
.ring text{font-family:Inter,sans-serif;font-weight:800}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:.86rem}
.kv:last-child{border-bottom:none}
.callout{display:flex;gap:10px;padding:11px 13px;border-radius:11px;background:var(--info-soft);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);font-size:.84rem;color:var(--text-2)}
.callout svg{width:18px;height:18px;flex:none;color:var(--accent);margin-top:1px}
.callout.warn{background:var(--warning-soft);border-color:color-mix(in srgb,var(--warning) 30%,transparent)}.callout.warn svg{color:var(--warning)}
.callout.danger{background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 30%,transparent)}.callout.danger svg{color:var(--danger)}
.callout.ok{background:var(--success-soft);border-color:color-mix(in srgb,var(--success) 30%,transparent)}.callout.ok svg{color:var(--success)}
pre.code{background:var(--code-bg);color:var(--code-text);padding:14px;border-radius:11px;overflow-x:auto;font-size:.8rem;line-height:1.6;margin:8px 0;max-width:100%;white-space:pre}
pre.text{white-space:pre-wrap;overflow-wrap:anywhere;font-family:inherit;margin:6px 0;font-size:.88rem}
ul.clean{margin:.35rem 0;padding-left:1.15rem}ul.clean li{margin:.2rem 0}
.section-label{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 4px}
.stars{display:inline-flex;gap:2px}
.star{border:none;background:none;padding:2px;cursor:pointer;color:var(--border-strong);font-size:1.15rem;line-height:1}
.star.on{color:#f59e0b}
.monogram{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:.95rem;flex:none;letter-spacing:.02em;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.topic{border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden}
.topic-head{display:flex;align-items:center;gap:10px;padding:12px 14px;width:100%;border:none;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}
.topic-head:hover{background:var(--surface-2)}
.topic-head .chev{transition:transform .2s;width:18px;height:18px;color:var(--muted);flex:none}
.topic.open .chev{transform:rotate(90deg)}
.topic-body{padding:4px 16px 16px;border-top:1px solid var(--border)}
.topic-ctrl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px;padding:12px;background:var(--surface-2);border-radius:11px}
.diagram{border:1px solid var(--border);border-radius:11px;background:var(--surface);margin:8px 0;overflow:hidden}
.diagram-view{overflow-x:auto;padding:12px;text-align:center;min-height:40px}
.diagram-view svg{max-width:none;height:auto}
.diagram-fallback{margin:0;border-radius:0}
.diagram-note{font-size:.72rem;color:var(--muted);padding:6px 12px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.chart-box{position:relative;height:250px;width:100%}
.heatmap{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;overflow-x:auto;padding-bottom:6px}
.heat{width:12px;height:12px;border-radius:3px;background:var(--heat-0)}
.heat.l1{background:var(--heat-1)}.heat.l2{background:var(--heat-2)}.heat.l3{background:var(--heat-3)}.heat.l4{background:var(--heat-4)}
.heat.future{background:transparent;border:1px dashed var(--border)}
.legend{display:flex;gap:4px;align-items:center;font-size:.72rem;color:var(--muted)}
.funnel-row{display:grid;grid-template-columns:130px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:.8rem;margin:5px 0}
.funnel-bar{height:16px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.funnel-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:5px}
.hint{padding:10px 12px;border-radius:10px;background:var(--warning-soft);margin:6px 0;font-size:.88rem;border:1px solid color-mix(in srgb,var(--warning) 25%,transparent)}
.locked{padding:18px;border-radius:12px;border:1.5px dashed var(--border-strong);text-align:center;background:var(--surface-2)}
.timer{font-family:var(--mono);font-size:1.3rem;font-weight:600;font-variant-numeric:tabular-nums}
.score-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.qcard{cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.qcard:hover{border-color:var(--primary)}
.table-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:11px}
table.t{border-collapse:collapse;width:100%;font-size:.82rem}
table.t th,table.t td{padding:7px 10px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
table.t th{background:var(--surface-2);font-weight:700}

/* Modal & Toasts */
.modal{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(8,10,20,.55);backdrop-filter:blur(3px)}
.modal[hidden]{display:none}
.modal-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);width:min(640px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;animation:pop .18s ease-out}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal-body{padding:18px;overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.toasts{position:fixed;right:16px;bottom:16px;z-index:400;display:flex;flex-direction:column;gap:8px;max-width:min(360px,calc(100vw - 32px))}

<script>
'use strict';
/* =====================================================================
   40LPAFOCUS — single-file app
   Layers: Utils/Validation → Store (repository over localStorage) →
   Services (tasks, dsa, roadmap, analytics…) → Views (pure HTML strings,
   all user text escaped) → Actions (event delegation) → App (router).
   ===================================================================== */
const APP_KEY = '40LPAFOCUS_v1';
const TIMER_KEY = '40LPAFOCUS_timers_v1';
const SCHEMA_VERSION = 1;
const $ = (s, r = document) => r.querySelector(s);

/* ---------------- Utilities ---------------- */
const U = {
  uid() {
    try { if (window.crypto && typeof crypto.randomUUID === 'function') return crypto.randomUUID(); } catch (e) {}
    return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6);
  },
  esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); },
  ymd(d) { const z = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); },
  today() { return U.ymd(new Date()); },
  parse(s) { const p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); },
  addDays(s, n) { const d = U.parse(s); d.setDate(d.getDate() + n); return U.ymd(d); },
  diff(a, b) { return Math.round((U.parse(b) - U.parse(a)) / 86400000); },
  fmt(s, opt) { if (!s) return ''; try { return U.parse(s).toLocaleDateString('en-IN', opt || { day: 'numeric', month: 'short', year: 'numeric' }); } catch (e) { return s; } },
  fmtShort(s) { return U.fmt(s, { day: 'numeric', month: 'short' }); },
  dow(s) { return U.parse(s).getDay(); },
  weekStart(s) { const d = U.parse(s); const k = (d.getDay() + 6) % 7; d.setDate(d.getDate() - k); return U.ymd(d); },
  pct(a, b) { return b > 0 ? Math.round((a / b) * 100) : 0; },
  mins(m) { m = Math.round(m || 0); if (m < 60) return m + 'm'; const h = Math.floor(m / 60), r = m % 60; return h + 'h' + (r ? ' ' + r + 'm' : ''); },
  secs(s) { s = Math.max(0, Math.floor(s)); const z = n => String(n).padStart(2, '0'); return z(Math.floor(s / 3600)) + ':' + z(Math.floor(s / 60) % 60) + ':' + z(s % 60); },
  debounce(fn, ms) { let t; return function (...a) { clearTimeout(t); t = setTimeout(() => fn.apply(this, a), ms); }; },
  tags(s) { return String(s || '').split(',').map(x => x.trim()).filter(Boolean).slice(0, 20).map(x => x.slice(0, 40)); },
  csvCell(v) { const s = Array.isArray(v) ? v.join('; ') : String(v == null ? '' : v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; },
  download(name, content, type) {
    const blob = new Blob([content], { type: type || 'text/plain' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  },
  hash(str) { let h = 0; for (let i = 0; i < str.length; i++) { h = (h * 31 + str.charCodeAt(i)) | 0; } return Math.abs(h); }
};

/* ---------------- Validation (regex only for simple formats) ---------------- */
const V = {
  date(s) { if (!/^\d{4}-\d{2}-\d{2}$/.test(String(s))) return false; const d = U.parse(s); return !isNaN(d) && U.ymd(d) === s; },
  time(s) { return /^([01]\d|2[0-3]):[0-5]\d$/.test(String(s)); },
  url(s) { if (!/^https?:\/\/[^\s]+$/i.test(String(s))) return false; try { const u = new URL(s); return !!u.hostname && u.hostname.includes('.'); } catch (e) { return false; } },
  text(s, min, max) { const t = String(s || '').trim(); return t.length >= (min || 0) && t.length <= (max || 5000); },
  int(s, min, max) { const n = Number(s); return Number.isInteger(n) && n >= min && n <= max; },
  id(s) { return typeof s === 'string' && /^[A-Za-z0-9_-]{4,80}$/.test(s); }
};

/* ---------------- Toasts ---------------- */
const Toast = {
  show(msg, kind) {
    const box = $('#toasts'); if (!box) return;
    const el = document.createElement('div'); el.className = 'toast ' + (kind || 'ok'); el.setAttribute('role', kind === 'err' ? 'alert' : 'status');
    const dot = document.createElement('span'); dot.className = 'ti'; const tx = document.createElement('div'); tx.textContent = msg;
    el.append(dot, tx); box.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 320); }, kind === 'err' ? 5200 : 2600);
    while (box.children.length > 4) box.firstChild.remove();
  },
  ok(m) { Toast.show(m, 'ok'); }, err(m) { Toast.show(m, 'err'); }, warn(m) { Toast.show(m, 'warn'); }, info(m) { Toast.show(m, 'info'); }
};

/* ---------------- Modal (+ confirm) ---------------- */
const Modal = {
  _cb: null, _lastFocus: null,
  open(title, html) {
    Modal._lastFocus = document.activeElement;
    $('#modalTitle').textContent = title; $('#modalBody').innerHTML = html; $('#modal').hidden = false;
    App.icons();
    const f = $('#modalBody').querySelector('input:not([type=hidden]):not([type=checkbox]),select,textarea,button');
    if (f) setTimeout(() => f.focus(), 30);
  },
  close() { $('#modal').hidden = true; $('#modalBody').innerHTML = ''; Modal._cb = null; if (Modal._lastFocus && Modal._lastFocus.focus) { try { Modal._lastFocus.focus(); } catch (e) {} } },
  isOpen() { return !$('#modal').hidden; },
  confirm(o, cb) {
    Modal._cbPending = cb;
    const typed = o.typed ? `<label class="fl" style="margin-top:12px">Type <b>${U.esc(o.typed)}</b> to confirm<input id="confirmTyped" autocomplete="off" data-expect="${U.esc(o.typed)}"></label>` : '';
    Modal.open(o.title || 'Are you sure?', `<p>${U.esc(o.msg)}</p>${typed}<div class="modal-foot"><button class="btn" data-action="closeModal">Cancel</button><button class="btn ${o.danger ? 'btn-danger-solid' : 'btn-primary'}" data-action="confirmYes">${U.esc(o.ok || 'Confirm')}</button></div>`);
    Modal._cb = cb;
  }
};

/* ---------------- Timers (persisted so a refresh does not lose a running timer) ---------------- */
const Timers = {
  data: {},
  load() { try { this.data = JSON.parse(localStorage.getItem(TIMER_KEY) || '{}') || {}; } catch (e) { this.data = {}; } },
  save() { try { localStorage.setItem(TIMER_KEY, JSON.stringify(this.data)); } catch (e) {} },
  start(key, meta) { this.data[key] = Object.assign({ start: Date.now() }, meta || {}); this.save(); },
  get(key) { return this.data[key] || null; },
  elapsed(key) { const t = this.data[key]; return t ? (Date.now() - t.start) / 1000 : 0; },
  stop(key) { const s = this.elapsed(key); delete this.data[key]; this.save(); return s; },
  tick() { document.querySelectorAll('[data-timer]').forEach(el => { el.textContent = U.secs(Timers.elapsed(el.dataset.timer)); }); }
};

/* ---------------- Charts & diagrams (optional libraries, graceful fallback) ---------------- */
const Charts = {
  list: [],
  destroyAll() { this.list.forEach(c => { try { c.destroy(); } catch (e) {} }); this.list = []; },
  make(id, cfg) {
    const el = document.getElementById(id); if (!el) return;
    if (typeof window.Chart === 'undefined') { el.parentElement.innerHTML = '<p class="muted small">Chart library could not load (offline or CDN blocked). The same numbers are shown in the cards on this page.</p>'; return; }
    const cs = getComputedStyle(document.documentElement);
    Chart.defaults.color = cs.getPropertyValue('--muted').trim(); Chart.defaults.borderColor = cs.getPropertyValue('--border').trim();
    Chart.defaults.font.family = 'Inter, system-ui, sans-serif';
    cfg.options = Object.assign({ responsive: true, maintainAspectRatio: false, animation: matchMedia('(prefers-reduced-motion: reduce)').matches ? false : { duration: 400 } }, cfg.options || {});
    try { this.list.push(new Chart(el, cfg)); } catch (e) { el.parentElement.innerHTML = '<p class="muted small">Chart could not render.</p>'; }
  },
  colors() { const cs = getComputedStyle(document.documentElement); return { p: cs.getPropertyValue('--primary').trim(), a: cs.getPropertyValue('--accent').trim(), s: cs.getPropertyValue('--success').trim(), w: cs.getPropertyValue('--warning').trim(), d: cs.getPropertyValue('--danger').trim() }; }
};
const Diagrams = {
  n: 0, inited: null,
  html(src, caption) {
    return `<div class="diagram" data-diagram><div class="diagram-view"></div><pre class="code diagram-fallback">${U.esc(src)}</pre><div class="diagram-note"><span>${U.esc(caption || 'Diagram')}</span><span>Scroll sideways inside the diagram if needed</span></div></div>`;
  },
  async renderAll(root) {
    const nodes = Array.from((root || document).querySelectorAll('[data-diagram]:not([data-done])'));
    if (!nodes.length) return;
    if (!window.mermaid) { nodes.forEach(n => { n.dataset.done = '1'; n.querySelector('.diagram-view').innerHTML = '<p class="muted small" style="margin:0">Diagram library unavailable — showing the text version below.</p>'; }); return; }
    const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'default';
    if (this.inited !== theme) { try { mermaid.initialize({ startOnLoad: false, theme, securityLevel: 'strict', fontFamily: 'Inter, sans-serif' }); this.inited = theme; } catch (e) {} }
    for (const n of nodes) {
      n.dataset.done = '1';
      const pre = n.querySelector('.diagram-fallback'); const view = n.querySelector('.diagram-view');
      try { const r = await mermaid.render('mmd' + (++this.n), pre.textContent); view.innerHTML = r.svg; pre.style.display = 'none'; }
      catch (e) { view.innerHTML = '<p class="muted small" style="margin:0">Diagram could not render — text version below.</p>'; const junk = document.getElementById('dmmd' + this.n); if (junk) junk.remove(); }
    }
  }
};
</script>
<script>
'use strict';
/* =====================================================================
   CONTENT BANKS — static study material (not user data)
   Company tags are intentionally NOT pre-filled on questions: we cannot
   verify which company asked what. Add your own tags per question.
   ===================================================================== */
const TASK_CATEGORIES = ['DSA', 'Java', 'Spring Boot', 'SQL', 'LLD', 'System Design', 'Microservices', 'AI/Python', 'Mock Interview', 'Applications', 'Revision', 'Other'];
const PRIORITIES = ['High', 'Medium', 'Low'];
const DSA_TOPICS = ['Arrays and Strings', 'Hashing', 'Two Pointers', 'Sliding Window', 'Binary Search', 'Sorting', 'Linked Lists', 'Stacks and Queues', 'Trees and BST', 'Heaps and Priority Queues', 'Graphs and BFS/DFS', 'Backtracking', 'Recursion', 'Dynamic Programming', 'Greedy Algorithms', 'Tries', 'Intervals', 'Bit Manipulation', 'Monotonic Stack', 'Union-Find', 'Topological Sorting', 'Shortest Path Algorithms'];
const DSA_STATUS = { new: 'Not started', attempted: 'Attempted', solved: 'Solved', revision: 'Needs Revision', skipped: 'Skipped' };
const TOPIC_STATUS = { notstarted: 'Not started', learning: 'Learning', revise: 'Needs revision', confident: 'Confident', mastered: 'Mastered' };

const QUESTIONS = [
{ id: 'q-second-largest', t: 'Second Largest Distinct Element', topic: 'Arrays and Strings', diff: 'Easy', est: 15, day1: true,
  stmt: 'Find the second-largest DISTINCT element in an integer array without sorting it. Return null (or an empty Optional) when it does not exist.',
  ex: 'Input: [12, 35, 1, 10, 34, 1]  → Output: 34\nInput: [10, 10, 10]  → Output: null (only one distinct value)\nInput: [-5, -2, -9]  → Output: -5',
  cons: '0 ≤ n ≤ 10^5; values fit in int (including Integer.MIN_VALUE)', edge: 'Empty or null array; single element; all duplicates; negatives only; Integer.MIN_VALUE present; largest value repeated',
  hints: ['You only need to remember two values while scanning once. What are they?', 'When you see a value bigger than the current largest, what happens to the old largest?', 'Skip values equal to the largest (duplicates). Use a sentinel that cannot clash with real data — a long, or a boolean "found" flag.'],
  tc: 'O(n)', sc: 'O(1)',
  sol: `public static Integer secondLargest(int[] a) {
    if (a == null || a.length < 2) return null;
    long first = Long.MIN_VALUE, second = Long.MIN_VALUE; // long sentinels never clash with int data
    for (int x : a) {
        if (x > first) {            // new maximum: old max becomes second
            second = first;
            first = x;
        } else if (x < first && x > second) { // strictly between: new second (skips duplicates of max)
            second = x;
        }
    }
    return second == Long.MIN_VALUE ? null : (int) second;
}`,
  exp: 'Single pass tracking the largest and second-largest distinct values. Using long sentinels means an array containing Integer.MIN_VALUE still works.',
  dry: '[12,35,1,10,34,1]: 12→(12,-∞) 35→(35,12) 1→no change 10→no change 34→(35,34) 1→no change ⇒ 34',
  mist: ['Sorting (O(n log n)) when O(n) is asked', 'Using Integer.MIN_VALUE as sentinel then failing on real MIN_VALUE input', 'Forgetting "distinct": [5,5] should return null, not 5', 'Not handling empty / null input'],
  fu: ['Return the k-th largest distinct element', 'What if the input is a stream you can read only once?', 'Return the index instead of the value'] },
{ id: 'q-product-except-self', t: 'Product of Array Except Self', topic: 'Arrays and Strings', diff: 'Medium', est: 25,
  stmt: 'Return an array where answer[i] is the product of every element except nums[i], without using division, in O(n).',
  ex: 'Input: [1,2,3,4] → Output: [24,12,8,6]', cons: '2 ≤ n ≤ 10^5; product fits in int', edge: 'Zeros in the array (one zero, two zeros); negatives',
  hints: ['answer[i] = (product of everything left of i) × (product of everything right of i).', 'Fill the left products in one pass into the output array.', 'Sweep from the right keeping a running "right product" variable — no extra array needed.'],
  tc: 'O(n)', sc: 'O(1) extra (output excluded)',
  sol: `public int[] productExceptSelf(int[] nums) {
    int n = nums.length;
    int[] ans = new int[n];
    ans[0] = 1;
    for (int i = 1; i < n; i++) ans[i] = ans[i - 1] * nums[i - 1];
    int right = 1;
    for (int i = n - 1; i >= 0; i--) {
        ans[i] *= right;
        right *= nums[i];
    }
    return ans;
}`,
  exp: 'Prefix products from the left are stored in ans; a running suffix product multiplies in from the right.', dry: '[1,2,3,4] left=[1,1,2,6]; right sweep: i3 6*1=6,r=4; i2 2*4=8,r=12; i1 1*12=12,r=24; i0 1*24=24',
  mist: ['Using division (breaks with zeros, and is disallowed)', 'Off-by-one in prefix indices'], fu: ['Handle overflow with long', 'What changes if division is allowed and there are zeros?'] },
{ id: 'q-two-sum', t: 'Two Sum', topic: 'Hashing', diff: 'Easy', est: 15,
  stmt: 'Given an array and a target, return indices of the two numbers that add up to target. Exactly one answer exists; do not use the same element twice.',
  ex: 'Input: nums=[2,7,11,15], target=9 → Output: [0,1]', cons: '2 ≤ n ≤ 10^4', edge: 'Duplicates like [3,3] target 6; negative numbers',
  hints: ['For each number x, what partner value do you need?', 'Could you remember values you have already seen along with their index?', 'Check the map for target - x BEFORE inserting x, which also handles duplicates.'],
  tc: 'O(n)', sc: 'O(n)',
  sol: `public int[] twoSum(int[] nums, int target) {
    Map<Integer, Integer> seen = new HashMap<>();
    for (int i = 0; i < nums.length; i++) {
        Integer j = seen.get(target - nums[i]);
        if (j != null) return new int[]{j, i};
        seen.put(nums[i], i);
    }
    return new int[0];
}`,
  exp: 'A HashMap stores value → index. Each lookup is O(1) on average.', dry: '[2,7,11,15],9: i0 need 7 none, put 2; i1 need 2 found idx0 ⇒ [0,1]',
  mist: ['Nested loops O(n²)', 'Inserting before checking, so x pairs with itself'], fu: ['Return all unique pairs', 'Input sorted — can you do O(1) space?', 'Three Sum'] },
{ id: 'q-group-anagrams', t: 'Group Anagrams', topic: 'Hashing', diff: 'Medium', est: 20,
  stmt: 'Group a list of strings so that anagrams are together.', ex: 'Input: ["eat","tea","tan","ate","nat","bat"] → [["eat","tea","ate"],["tan","nat"],["bat"]]',
  cons: '1 ≤ n ≤ 10^4, lowercase letters', edge: 'Empty strings; single string',
  hints: ['Anagrams share a canonical form. What could it be?', 'Sorted characters work as a key; a 26-count signature avoids the sort.', 'Map<String, List<String>> with computeIfAbsent.'],
  tc: 'O(n·k log k) with sorting; O(n·k) with counts', sc: 'O(n·k)',
  sol: `public List<List<String>> groupAnagrams(String[] strs) {
    Map<String, List<String>> groups = new HashMap<>();
    for (String s : strs) {
        char[] c = s.toCharArray();
        Arrays.sort(c);
        groups.computeIfAbsent(new String(c), k -> new ArrayList<>()).add(s);
    }

    for (int i = 0; i < parent.length; i++) parent[i] = i;
    for (int[] e : edges) {
        int a = find(parent, e[0]), b = find(parent, e[1]);
        if (a == b) return e;
        if (rank[a] < rank[b]) { int t = a; a = b; b = t; }
        parent[b] = a;
        if (rank[a] == rank[b]) rank[a]++;
    }
    return new int[0];
}
private int find(int[] p, int x) {
    while (p[x] != x) { p[x] = p[p[x]]; x = p[x]; } // path halving
    return x;
}`,

{ id: 'q-course-schedule', t: 'Course Schedule', topic: 'Topological Sorting', diff: 'Medium', est: 25,
  stmt: 'Given numCourses and prerequisite pairs [a, b] (b before a), can all courses be finished?', ex: 'n=2, [[1,0]] → true; n=2, [[1,0],[0,1]] → false', cons: 'n ≤ 2000', edge: 'No prerequisites; self-loop',
  hints: ['This is cycle detection in a directed graph.', 'Kahn\'s algorithm: start from nodes with in-degree 0.', 'If processed count < n, a cycle exists.'],
  tc: 'O(V + E)', sc: 'O(V + E)',
  sol: `public boolean canFinish(int n, int[][] pre) {
    List<List<Integer>> g = new ArrayList<>();
    for (int i = 0; i < n; i++) g.add(new ArrayList<>());
    int[] indeg = new int[n];
    for (int[] p : pre) { g.get(p[1]).add(p[0]); indeg[p[0]]++; }
    Deque<Integer> q = new ArrayDeque<>();
    for (int i = 0; i < n; i++) if (indeg[i] == 0) q.offer(i);
    int done = 0;
    while (!q.isEmpty()) {
        int c = q.poll(); done++;
        for (int nx : g.get(c)) if (--indeg[nx] == 0) q.offer(nx);
    }
    return done == n;
}`,

{ id: 'q-network-delay', t: 'Network Delay Time (Dijkstra)', topic: 'Shortest Path Algorithms', diff: 'Medium', est: 30,
  stmt: 'Directed weighted edges times[i] = (u, v, w). A signal starts at k. Return the time for all n nodes to receive it, or -1.', ex: 'times=[[2,1,1],[2,3,1],[3,4,1]], n=4, k=2 → 2', cons: '1 ≤ n ≤ 100, non-negative weights', edge: 'Unreachable node; single node',
  hints: ['Shortest paths from one source with non-negative weights.', 'Use a min-heap of (distance, node).', 'Skip stale heap entries whose distance is larger than the recorded best.'],
  tc: 'O(E log V)', sc: 'O(V + E)',
  sol: `public int networkDelayTime(int[][] times, int n, int k) {
    List<List<int[]>> g = new ArrayList<>();
    for (int i = 0; i <= n; i++) g.add(new ArrayList<>());
    for (int[] t : times) g.get(t[0]).add(new int[]{t[1], t[2]});
    int[] dist = new int[n + 1];
    Arrays.fill(dist, Integer.MAX_VALUE);
    dist[k] = 0;
    PriorityQueue<int[]> pq = new PriorityQueue<>((a, b) -> Integer.compare(a[0], b[0]));
    pq.offer(new int[]{0, k});
    while (!pq.isEmpty()) {
        int[] cur = pq.poll();
        int d = cur[0], u = cur[1];
        if (d > dist[u]) continue;
        for (int[] e : g.get(u)) {
            if (d + e[1] < dist[e[0]]) { dist[e[0]] = d + e[1]; pq.offer(new int[]{dist[e[0]], e[0]}); }
        }
    }
    int max = 0;
    for (int i = 1; i <= n; i++) { if (dist[i] == Integer.MAX_VALUE) return -1; max = Math.max(max, dist[i]); }
    return max;
}`,

<script>

const ALL_STUDY = () => [].concat(JAVA_TOPICS, SPRING_TOPICS, SPRING_SCENARIOS, SQL_TOPICS, SQL_EXERCISES, LLD_PATTERNS, LLD_EXERCISES, HLD_CASES, MICRO_TOPICS, AI_TOPICS);

const Roadmap = {
  generate(start) {
    const out = [];
    ROADMAP_TEMPLATE.forEach(p => p.items.forEach(([day, title]) => out.push({ id: U.uid(), phase: p.phase, title, day, due: U.addDays(start, day - 1), done: false, doneOn: '', custom: false })));

  phaseOf(n) { return ROADMAP_TEMPLATE.find(p => p.phase === n); }
};

/* ---------------- Store: single source of truth + repository over localStorage ---------------- */
const Store = (() => {
  let s = null; let recovered = false;
  const status = { ok: true, msg: 'Ready', pending: false };
  function defaults() {
    const start = U.today();
    return {
      schemaVersion: SCHEMA_VERSION, createdAt: new Date().toISOString(), lastSaved: null,
      profile: { name: '', experience: '6+ years', role: 'Java Developer', stack: 'Java 8, Spring MVC, REST APIs, SQL, Oracle', target: 'Senior Software Engineer / Backend Engineer', comp: '₹40 LPA', days: 180, dailyMin: 120, lang: 'Java', extra: 'Modern Java, Spring Boot, Microservices, System Design, Python, AI integration', weakness: 'Solving coding interview questions independently under time pressure.', startDate: start },
      settings: { theme: document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light' },
      tasks: [], series: [], reflections: {}, dsa: {}, topics: {}, sqlWork: {}, hldSteps: {},
      roadmap: Roadmap.generate(start),
      companies: COMPANY_DEFAULTS.map(c => ({ id: c.id, name: c.name, mono: c.mono, color: c.color, note: c.note, builtin: true, checks: {}, notes: '' })),
      jobs: [], mocks: [], weekly: {}, notes: []

  }
  function validate(d) {
    if (!d || typeof d !== 'object' || Array.isArray(d)) return 'File is not a 40LPAFOCUS JSON object.';
    if (typeof d.schemaVersion !== 'number') return 'Missing schemaVersion — this does not look like a 40LPAFOCUS backup.';
    if (d.schemaVersion > SCHEMA_VERSION) return 'Backup was created by a newer version of the app.';
    for (const k of ['tasks', 'series', 'jobs', 'mocks', 'notes', 'companies', 'roadmap']) if (d[k] !== undefined && !Array.isArray(d[k])) return '"' + k + '" must be a list.';
    for (const k of ['profile', 'settings', 'reflections', 'dsa', 'topics', 'sqlWork', 'weekly', 'hldSteps']) if (d[k] !== undefined && (typeof d[k] !== 'object' || d[k] === null || Array.isArray(d[k]))) return '"' + k + '" must be an object.';
    for (const t of d.tasks || []) if (!t || typeof t.id !== 'string' || typeof t.title !== 'string' || !V.date(t.date)) return 'A task record is invalid.';
    for (const x of d.series || []) if (!x || typeof x.id !== 'string' || !V.date(x.startDate) || !x.tpl) return 'A recurring-task record is invalid.';
    for (const j of d.jobs || []) if (!j || typeof j.id !== 'string' || typeof j.company !== 'string') return 'A job record is invalid.';
    for (const n of d.notes || []) if (!n || typeof n.id !== 'string' || typeof n.title !== 'string') return 'A note record is invalid.';
    for (const m of d.mocks || []) if (!m || typeof m.id !== 'string' || !V.date(m.date)) return 'A mock interview record is invalid.';
    for (const r of d.roadmap || []) if (!r || typeof r.id !== 'string' || typeof r.title !== 'string' || !V.date(r.due)) return 'A roadmap record is invalid.';
    for (const c of d.companies || []) if (!c || typeof c.id !== 'string' || typeof c.name !== 'string') return 'A company record is invalid.';
    if (d.profile && d.profile.startDate !== undefined && !V.date(d.profile.startDate)) return 'Profile start date is invalid.';
    return null;
  }
  function migrate(d) {
    // v1 is the first schema. Future versions add steps here: if (d.schemaVersion === 1) { …; d.schemaVersion = 2; }
    const def = defaults();
    for (const k in def) if (d[k] === undefined) d[k] = def[k];
    d.profile = Object.assign({}, def.profile, d.profile);
    d.settings = Object.assign({}, def.settings, d.settings);
    d.schemaVersion = SCHEMA_VERSION;
    return d;
  }
  function setStatus(ok, msg, pending) { status.ok = ok; status.msg = msg; status.pending = !!pending; App.saveStatus(); }
  function load() {
    let raw = null;
    try { raw = localStorage.getItem(APP_KEY); } catch (e) { s = defaults(); setStatus(false, 'Browser storage unavailable — changes will NOT persist'); return; }
    if (!raw) { s = defaults(); persist(); return; }
    try {
      const d = JSON.parse(raw); const err = validate(d); if (err) throw new Error(err);
      s = migrate(d);
      setStatus(true, s.lastSaved ? 'Saved ' + new Date(s.lastSaved).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) : 'Ready');
    } catch (e) {
      try { localStorage.setItem(APP_KEY + '_corrupt_' + Date.now(), raw); } catch (_) {}
      s = defaults(); recovered = true; persist();
    }
  }
  function persist() {
    try {
      s.lastSaved = new Date().toISOString();
      localStorage.setItem(APP_KEY, JSON.stringify(s));
      setStatus(true, 'Saved ' + new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }));
      return true;
    } catch (e) {
      setStatus(false, e && e.name === 'QuotaExceededError' ? 'Save failed: storage full' : 'Save failed');
      return false;
    }
  }

  return {
    get s() { return s; }, get recovered() { return recovered; }, status, defaults, validate, migrate, load,
    update(fn, toast) {
      try { fn(s); } catch (e) { console.error(e); Toast.err('Could not apply change: ' + e.message); return false; }
      const ok = persist(); App.render();
      if (toast) ok ? Toast.ok(toast) : Toast.err('Save failed — your browser storage may be full or blocked.');

    },
    quiet(fn) { fn(s); setStatus(true, 'Saving…', true); debounced(); },
    replace(d) { s = migrate(d); const ok = persist(); App.render(); return ok; },
    external(raw) { try { const d = JSON.parse(raw); if (!validate(d)) { s = migrate(d); App.render(); Toast.info('Data updated from another tab'); } } catch (e) {} },
    size() { try { return (localStorage.getItem(APP_KEY) || '').length; } catch (e) { return 0; } }
  };
})();

/* ---------------- Tasks ---------------- */
const Tasks = {
  make(o) {
    return { id: U.uid(), title: String(o.title).trim(), category: o.category, date: o.date, start: o.start || '', duration: Number(o.duration) || 30, priority: o.priority || 'Medium', notes: String(o.notes || '').trim(), done: false, completedOn: '', actualMin: 0, seriesId: o.seriesId || '', occDate: o.occDate || '', createdAt: new Date().toISOString() };
  },
  /* Generate date-specific occurrences for recurring series up to 14 days ahead.
     Keys are seriesId|occDate so refreshing never duplicates; deleted occurrences are remembered in series.skip. */
  ensureOccurrences(st) {
    const horizon = U.addDays(U.today(), 14); let added = 0;
    const keys = new Set(st.tasks.filter(t => t.seriesId).map(t => t.seriesId + '|' + (t.occDate || t.date)));
    st.series.forEach(sr => {
      const end = sr.endDate && sr.endDate < horizon ? sr.endDate : horizon;
      let d = sr.genUntil && sr.genUntil >= sr.startDate ? U.addDays(sr.genUntil, 1) : sr.startDate; let guard = 0;
      while (d <= end && guard++ < 1000) {
        const ok = sr.pattern === 'daily' || (sr.days || []).includes(U.dow(d));
        if (ok && !keys.has(sr.id + '|' + d) && !(sr.skip || []).includes(d)) { st.tasks.push(Tasks.make(Object.assign({}, sr.tpl, { date: d, seriesId: sr.id, occDate: d }))); keys.add(sr.id + '|' + d); added++; }
        d = U.addDays(d, 1);
      }
      if (!sr.genUntil || end > sr.genUntil) sr.genUntil = end;
    });
    return added;
  },
  sort(a, b) { return a.date.localeCompare(b.date) || (a.start || '99').localeCompare(b.start || '99') || PRIORITIES.indexOf(a.priority) - PRIORITIES.indexOf(b.priority); }
};

/* ---------------- DSA & study topics ---------------- */
const DSA = {
  p(id) { const d = Store.s.dsa[id]; return Object.assign({ status: 'new', conf: 0, notes: '', noHints: false, hints: 0, revealed: false, attempts: [], review: '', tags: [], solvedAt: '' }, d || {}); },
  attempted(p) { return p.attempts.length > 0 || p.status === 'attempted' || p.status === 'solved' || p.status === 'revision'; },
  schedule(p) {
    const T = U.today();
    if (p.status === 'revision') p.review = U.addDays(T, 2);
    else if (p.status === 'solved') { const c = p.conf || 3; p.review = U.addDays(T, c <= 2 ? 3 : c === 3 ? 7 : c === 4 ? 14 : 30); }
    else if (p.status === 'attempted') p.review = U.addDays(T, 1);

  mutate(id, fn, toast) { return Store.update(s => { const p = DSA.p(id); fn(p); s.dsa[id] = p; }, toast); },
  daily() {
    const d1 = QUESTIONS.find(q => q.day1);
    if (DSA.p(d1.id).status !== 'solved') return d1;
    const pool = QUESTIONS.filter(q => DSA.p(q.id).status !== 'solved');
    const list = pool.length ? pool : QUESTIONS;

  dueReviews() { const T = U.today(); return QUESTIONS.map(q => ({ q, p: DSA.p(q.id) })).filter(x => x.p.review && x.p.review <= T).sort((a, b) => a.p.review.localeCompare(b.p.review)); },
  allTags() { const set = new Set(); Object.values(Store.s.dsa).forEach(p => (p.tags || []).forEach(t => set.add(t))); return Array.from(set).sort(); }
};
const Topics = {
  p(id) { return Object.assign({ status: 'notstarted', conf: 0, notes: '', review: '' }, Store.s.topics[id] || {}); },
  mutate(id, fn, toast) { return Store.update(s => { const p = Topics.p(id); fn(p); s.topics[id] = p; }, toast); }
};
const Mocks = {
  avg(m) { const v = Object.values(m.scores || {}).map(Number).filter(x => x > 0); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0; },
  prompt(type) {
    const pick = a => a[Math.floor(Math.random() * a.length)];
    if (type === 'Coding') return pick(QUESTIONS).t;
    if (type === 'Java/Backend') return Math.random() < .5 ? pick(SPRING_SCENARIOS).t : pick(pick(JAVA_TOPICS).qs);
    if (type === 'System Design') return 'Design: ' + pick(HLD_CASES).t;

};

/* ---------------- Analytics (everything derived from stored records) ---------------- */
const Analytics = {
  activity() {
    const s = Store.s, mins = {}, active = new Set();
    s.tasks.forEach(t => { if (t.actualMin > 0) { mins[t.date] = (mins[t.date] || 0) + Number(t.actualMin); active.add(t.date); } if (t.done && t.completedOn) active.add(t.completedOn); });
    Object.values(s.dsa).forEach(p => (p.attempts || []).forEach(a => { const m = Math.round(a.sec / 60); if (V.date(a.date)) { mins[a.date] = (mins[a.date] || 0) + m; active.add(a.date); } }));
    s.mocks.forEach(x => { mins[x.date] = (mins[x.date] || 0) + (Number(x.duration) || 0); active.add(x.date); });
    s.roadmap.forEach(r => { if (r.done && r.doneOn) active.add(r.doneOn); });
    return { mins, active };
  },
  streaks(active) {
    const T = U.today(); let cur = 0; let d = active.has(T) ? T : U.addDays(T, -1);
    while (active.has(d)) { cur++; d = U.addDays(d, -1); }
    const days = Array.from(active).filter(x => x <= T).sort(); let best = 0, run = 0, prev = null;
    days.forEach(x => { run = prev && U.diff(prev, x) === 1 ? run + 1 : 1; best = Math.max(best, run); prev = x; });
    return { cur, best };
  },
  metrics() {
    const s = Store.s, T = U.today(), act = this.activity(), st = this.streaks(act.active);
    const totalMin = Object.values(act.mins).reduce((a, b) => a + b, 0);
    const qp = QUESTIONS.map(q => DSA.p(q.id));
    const attempted = qp.filter(p => DSA.attempted(p)).length, solved = qp.filter(p => p.status === 'solved').length, revision = qp.filter(p => p.status === 'revision').length;
    const study = ALL_STUDY(); const tps = study.map(t => Topics.p(t.id));
    const mastered = tps.filter(p => p.status === 'mastered').length, confident = tps.filter(p => p.status === 'confident').length;

    const wk = s.tasks.filter(t => t.date >= ws && t.date <= we);
    const today = s.tasks.filter(t => t.date === T);
    const elapsed = U.diff(s.profile.startDate, T) + 1; const total = Number(s.profile.days) || 180;
    const mocks = s.mocks.slice().sort((a, b) => a.date.localeCompare(b.date));
    const jobs = s.jobs, rs = STAGE_IDX('Recruiter Screen');
    return {
      act, st, totalMin, attempted, solved, revision, mastered, confident, studyTotal: study.length, rmDone, rmTotal: s.roadmap.length, topicPct, rmPct, dsaPct, overall,
      weekPct: U.pct(wk.filter(t => t.done).length, wk.length), weekTotal: wk.length, weekDone: wk.filter(t => t.done).length,
      todayTotal: today.length, todayDone: today.filter(t => t.done).length, todayPlanned: today.reduce((a, t) => a + (t.duration || 0), 0),
      day: Math.max(0, Math.min(total, elapsed)), totalDays: total, startsIn: elapsed < 1 ? 1 - elapsed : 0,
      mocks, mockLast: mocks.length ? Mocks.avg(mocks[mocks.length - 1]) : 0,
      jobsTotal: jobs.length, interviews: jobs.filter(j => (j.maxStage || 0) >= rs).length,
      rounds: jobs.reduce((a, j) => a + Math.max(0, (j.maxStage || 0) - rs), 0),
      overdue: s.tasks.filter(t => !t.done && t.date < T).length
    };
  },
  /* Strategy list: first rule that returns a recommendation wins */
  recommenders: [
    () => { const t = Store.s.tasks.filter(x => !x.done && x.date < U.today()).sort(Tasks.sort)[0]; return t && { title: t.title, why: 'Overdue task from ' + U.fmt(t.date) + '. Finish it or move it.', go: 'planner', icon: 'triangle-alert' }; },
    () => { const t = Store.s.tasks.filter(x => !x.done && x.date === U.today()).sort((a, b) => PRIORITIES.indexOf(a.priority) - PRIORITIES.indexOf(b.priority))[0]; return t && { title: t.title, why: t.priority + ' priority task planned for today' + (t.start ? ' at ' + t.start : '') + '.', go: 'planner', icon: 'calendar-check' }; },
    () => { const r = DSA.dueReviews()[0]; return r && { title: 'Revise: ' + r.q.t, why: 'Scheduled DSA revision is due. Re-solve it without looking at your notes.', q: r.q.id, icon: 'rotate-ccw' }; },
    () => { const q = DSA.daily(); return DSA.p(q.id).status !== 'solved' && { title: (q.day1 ? 'Day 1 challenge: ' : 'Daily challenge: ') + q.t, why: q.diff + ' · ~' + q.est + ' min · attempt before revealing hints.', q: q.id, icon: 'target' }; },
    () => { const r = Store.s.roadmap.filter(x => !x.done).sort((a, b) => a.due.localeCompare(b.due))[0]; return r && { title: r.title, why: 'Next roadmap item, due ' + U.fmt(r.due) + '.', go: 'roadmap', icon: 'map' }; },
    () => ({ title: 'Plan tomorrow in the Daily Focus Planner', why: 'Everything planned is done. Add tomorrow\'s priorities.', go: 'planner', icon: 'sparkles' })
  ],
  next() { for (const r of this.recommenders) { const x = r(); if (x) return x; } return null; }
};

  const filtersOn = f.q || f.topic || f.diff || f.status || f.tag;
  return H.head('DSA Practice — Java', `${QUESTIONS.length} curated interview questions across all ${DSA_TOPICS.length} topics, each with progressive hints, a hidden Java solution, dry run and follow-ups. This is a focused starter bank, not hundreds of questions — add more via Notes.`, `<button class="btn" data-action="randomQ">${H.i('shuffle')} Random practice</button>`) + `
  <div class="grid g3" style="margin-bottom:16px">

      <div class="item-title">${U.esc(daily.t)}</div><div class="item-meta" style="margin:4px 0 12px">${H.diff(daily.diff)} <span>${U.esc(daily.topic)}</span><span>~${daily.est} min</span></div>
      <button class="btn btn-primary" data-action="openQ" data-id="${daily.id}">${H.i('play')} Attempt it</button></div>
    <div class="card"><div class="card-head"><h3>${H.i('gauge')} Progress</h3></div>
      <div class="kv"><span>Attempted</span><b>${m.attempted}</b></div><div class="kv"><span>Solved</span><b>${m.solved}</b></div><div class="kv"><span>Needs revision</span><b>${m.revision}</b></div>
      <div style="margin-top:8px">${H.bar(m.dsaPct)}</div><p class="muted tiny">${m.dsaPct}% of the bank solved</p></div>
    <div class="card"><div class="card-head"><h3>${H.i('rotate-ccw')} Revision queue</h3><span class="badge ${due.length ? 'b-warning' : ''}">${due.length} due</span></div>
      ${due.length ? `<div class="list">${due.slice(0, 3).map(r => `<div class="item"><div class="item-body"><div class="item-title small">${U.esc(r.q.t)}</div><div class="item-meta">Due ${U.fmtShort(r.p.review)}</div></div><div class="item-actions"><button class="btn btn-sm" data-action="openQ" data-id="${r.q.id}">Open</button><button class="btn btn-sm btn-ghost" data-action="dsaReviewed" data-id="${r.q.id}" title="Mark revised and reschedule">${H.i('check')}</button></div></div>`).join('')}</div>` : '<p class="muted small">Nothing due. Low-confidence and "Needs Revision" questions are scheduled automatically (spaced repetition).</p>'}</div>
  </div>
  <div class="toolbar">
    ${H.search('dsa.q', f.q, 'Search questions…', 'dSearch')}
    <select data-bind="dsa.topic" aria-label="Filter by topic">${H.opts(DSA_TOPICS, f.topic, 'All topics')}</select>
    <select data-bind="dsa.diff" aria-label="Filter by difficulty">${H.opts(['Easy', 'Medium', 'Hard'], f.diff, 'Any difficulty')}</select>

    <select data-bind="dsa.tag" aria-label="Filter by company tag" ${tags.length ? '' : 'disabled title="Add company tags on a question first"'}>${H.opts(tags, f.tag, tags.length ? 'Any company tag' : 'No company tags yet')}</select>
    ${filtersOn ? `<button class="btn btn-sm btn-ghost" data-action="clearDsa">${H.i('x')} Clear</button>` : ''}
  </div>
  <div class="grid g2" style="margin-bottom:16px">${qs.length ? qs.map(q => { const p = DSA.p(q.id); return `<button class="card qcard" data-action="openQ" data-id="${q.id}"><div class="card-head" style="margin-bottom:6px"><h3>${U.esc(q.t)}</h3>${H.dsaStatus(p.status)}</div><div class="item-meta">${H.diff(q.diff)}<span>${U.esc(q.topic)}</span><span>~${q.est} min</span>${p.conf ? `<span>${'★'.repeat(p.conf)}</span>` : ''}${p.noHints && p.status === 'solved' ? '<span class="badge b-success">No hints</span>' : ''}${(p.tags || []).map(t => `<span class="badge">${U.esc(t)}</span>`).join('')}</div></button>`; }).join('')
    : `<div class="span2">${H.empty('search-x', 'No questions match', 'Clear the filters to see the full bank.')}</div>`}</div>
  <div class="card"><div class="card-head"><h2>${H.i('chart-column')} Progress by topic</h2></div><div class="chart-box" style="height:${Math.max(320, DSA_TOPICS.length * 22)}px"><canvas id="chDsaTopic" aria-label="Attempted and solved per topic"></canvas></div></div>`;

    </div>
    <label class="fl" style="margin-top:12px">Your company tags (comma separated — only add ones you have verified)<input value="${U.esc((p.tags || []).join(', '))}" data-change="dsaTags" data-id="${q.id}" maxlength="200" placeholder="e.g. Amazon, Uber"></label>
  </div>

      ${p.hints < 3 ? `<button class="btn" data-action="dsaHint" data-id="${q.id}" style="margin-top:8px">${H.i('eye')} Reveal hint ${p.hints + 1}</button>` : ''}

/* ---------- 4–10. Study modules (one generic renderer) ---------- */
const MODULES = {
  java: { title: 'Java Mastery', sub: 'Java 8-compatible examples unless marked "Java 9+". Track status, confidence and revision dates per topic.', groups: [{ title: 'Core & modern Java', topics: JAVA_TOPICS }] },
  spring: { title: 'Spring Boot & Backend', sub: 'Backend engineering depth plus production scenarios — try answering before revealing the outline.', groups: [{ title: 'Production scenarios', topics: SPRING_SCENARIOS }, { title: 'Topics', topics: SPRING_TOPICS }] },
  sql: { title: 'SQL & Database', sub: 'Concepts and editable exercises. Your SQL is saved but NOT executed — there is no database in the browser. Compare with the reference and expected output.', groups: [{ title: 'Exercises', topics: SQL_EXERCISES }, { title: 'Concepts', topics: SQL_TOPICS }] },
  lld: { title: 'Low-Level Design', sub: 'Practical LLD exercises with class diagrams, plus the patterns interviewers expect.', groups: [{ title: 'LLD exercises', topics: LLD_EXERCISES }, { title: 'Patterns & principles', topics: LLD_PATTERNS }] },
  hld: { title: 'High-Level System Design', sub: 'Use the 13-step framework on every case. Example numbers are illustrative — no single architecture is universally correct.', groups: [{ title: 'Practice cases', topics: HLD_CASES }] },
  micro: { title: 'Microservices & Distributed Systems', sub: 'Communication, consistency and resilience patterns with diagrams.', groups: [{ title: 'Topics', topics: MICRO_TOPICS }] },
  ai: { title: 'AI & Python Fundamentals', sub: 'A supporting skill. Items tagged "Core for backend" matter in backend interviews; "Optional AI specialization" is extra.', groups: [{ title: 'Topics', topics: AI_TOPICS }] }
};
Views.module = (key) => {
  const mod = MODULES[key]; const f = UI.mod[key] || (UI.mod[key] = { q: '', status: '' });
  const all = [].concat.apply([], mod.groups.map(g => g.topics)); const ps = all.map(t => Topics.p(t.id));
  const mastered = ps.filter(p => p.status === 'mastered').length, conf = ps.filter(p => p.conf).map(p => p.conf);
  const avg = conf.length ? (conf.reduce((a, b) => a + b, 0) / conf.length).toFixed(1) : '—';
  const match = t => { const p = Topics.p(t.id); if (f.status && p.status !== f.status) return false; if (f.q) { const s = f.q.toLowerCase(); return (t.t + ' ' + (t.ex || '') + ' ' + (t.qs || []).join(' ')).toLowerCase().includes(s); } return true; };
  const framework = key === 'hld' ? `<div class="card" style="margin-bottom:16px"><div class="card-head"><h2>${H.i('list-ordered')} System design answer framework</h2><span class="muted small">Tick steps per case inside each case card</span></div><div class="grid g3">${HLD_STEPS.map((s, i) => `<div class="item"><span class="monogram" style="width:30px;height:30px;font-size:.8rem;background:var(--primary)">${i + 1}</span><div class="item-body"><div class="item-title small">${s[0]}</div><div class="item-meta">${s[1]}</div></div></div>`).join('')}</div></div>` : '';
  return H.head(mod.title, mod.sub) + `
  <div class="grid g3" style="margin-bottom:16px">${H.stat('Mastered', mastered + ' / ' + all.length, U.pct(mastered, all.length) + '% of this section', 'award')}${H.stat('Average confidence', avg + (conf.length ? ' / 5' : ''), conf.length + ' rated', 'star')}${H.stat('Needs revision', ps.filter(p => p.status === 'revise').length, 'Marked "Needs revision"', 'rotate-ccw')}</div>
  ${framework}
  <div class="toolbar">${H.search('mod.' + key + '.q', f.q, 'Search ' + mod.title + '…', 'mSearch-' + key)}<select data-bind="mod.${key}.status" aria-label="Filter by status">${H.opts(Object.entries(TOPIC_STATUS), f.status, 'Any status')}</select>
    <button class="btn btn-sm btn-ghost" data-action="expandAll" data-mod="${key}">${H.i('chevrons-down')} Expand all</button><button class="btn btn-sm btn-ghost" data-action="collapseAll" data-mod="${key}">${H.i('chevrons-up')} Collapse</button></div>
  ${mod.groups.map(g => { const list = g.topics.filter(match); return `<div class="section-label" style="margin:18px 0 8px">${U.esc(g.title)} · ${list.length}</div><div class="list">${list.length ? list.map(t => Views.topicCard(t)).join('') : '<p class="muted small">No items match.</p>'}</div>`; }).join('')}`;
};
Views.topicCard = (t) => {

    if (t.ex) body += `<p>${U.esc(t.ex)}</p>`;

    if (t.diagram) body += `<div class="section-label">Diagram</div>${Diagrams.html(t.diagram, t.t)}`;
    if (t.framework) { const done = Store.s.hldSteps[t.id] || []; body += `<div class="section-label">Framework checklist for this case · ${done.length}/${HLD_STEPS.length}</div><div class="chips">${HLD_STEPS.map((s, i) => `<label class="chip check"><input type="checkbox" data-change="hldStep" data-id="${t.id}" data-i="${i}" ${done.includes(i) ? 'checked' : ''}> ${i + 1}. ${U.esc(s[0])}</label>`).join('')}</div>`; }

    if (t.qs && t.qs.length) body += `<div class="section-label">Interview questions</div>${H.list(t.qs)}`;
    if (t.fu && t.fu.length) body += `<div class="section-label">Common follow-ups</div>${H.list(t.fu)}`;
    body += `<div class="topic-ctrl"><label class="fl">Status<select data-change="topicStatus" data-id="${t.id}">${H.opts(Object.entries(TOPIC_STATUS), p.status)}</select></label>
      <div class="fl">Confidence${H.stars(p.conf, 'topicConf', t.id)}</div>

      <label class="fl" style="grid-column:1/-1">Revision notes<textarea id="tnote-${t.id}" data-input="topicNote" data-id="${t.id}" rows="3" maxlength="4000" placeholder="Key points, mistakes, what to say in the interview…">${U.esc(p.notes)}</textarea></label></div>`;
  }
  return `<div class="topic ${open ? 'open' : ''}"><button class="topic-head" data-action="toggleOpen" data-id="${t.id}" aria-expanded="${open}"><i data-lucide="chevron-right" data-fb="›" class="chev"></i><span style="flex:1;min-width:0;font-weight:650;overflow-wrap:anywhere">${U.esc(t.t)}</span>${t.tag ? `<span class="badge ${t.tag === 'Core for backend' ? 'b-primary' : 'b-info'}">${U.esc(t.tag)}</span>` : ''}${p.conf ? `<span class="tiny" style="color:#f59e0b">${'★'.repeat(p.conf)}</span>` : ''}${H.topicStatus(p.status)}</button>${open ? `<div class="topic-body">${body}</div>` : ''}</div>`;
};
['java', 'spring', 'sql', 'lld', 'hld', 'micro', 'ai'].forEach(k => { Views[k] = () => Views.module(k); });
</script>
<script>
'use strict';
/* ---------- 11. Company preparation ---------- */
const Company = {
  total() { return Object.values(CHECKLIST).reduce((a, l) => a + l.length, 0); },
  readiness(c) { return U.pct(Object.values(c.checks || {}).filter(Boolean).length, this.total()); },
  catPct(c, k) { return U.pct(CHECKLIST[k].filter((_, i) => c.checks && c.checks[k + ':' + i]).length, CHECKLIST[k].length); }
};
Views.companies = () => {
  const s = Store.s; const c = s.companies.find(x => x.id === UI.company);
  if (c) return Views.companyDetail(c);
  return H.head('Company Interview Preparation', 'A workspace per company. Readiness = share of preparation checklist items you have ticked. Guidance is general and labelled — interview processes differ by role, level and location.', `<button class="btn btn-primary" data-action="addCompany">${H.i('plus')} Add company</button>`) + `
  <div class="callout" style="margin-bottom:16px">${H.i('info')}<div>Company badges are simple monograms, not official logos. Notes marked "General guidance" summarise widely-published information — always confirm the current process with your recruiter. No recent interview questions are invented here.</div></div>
  <div class="grid g3">${s.companies.map(c => { const r = Company.readiness(c); const apps = s.jobs.filter(j => j.company.toLowerCase() === c.name.toLowerCase()); return `<button class="card qcard" data-action="openCompany" data-id="${c.id}"><div class="btn-row" style="flex-wrap:nowrap"><span class="monogram" style="background:${U.esc(c.color)}">${U.esc(c.mono)}</span><div style="flex:1;min-width:0"><h3>${U.esc(c.name)}</h3><div class="item-meta">${apps.length} application${apps.length === 1 ? '' : 's'} · ${s.mocks.filter(m => m.company === c.name).length} mocks</div></div>${H.ring(r, 58, 6)}</div><div style="margin-top:12px">${H.bar(r)}</div></button>`; }).join('')}</div>`;
};
Views.companyDetail = (c) => {
  const s = Store.s; const r = Company.readiness(c);
  const apps = s.jobs.filter(j => j.company.toLowerCase() === c.name.toLowerCase());
  const mocks = s.mocks.filter(m => m.company === c.name).sort((a, b) => b.date.localeCompare(a.date));
  return `<div class="btn-row" style="margin-bottom:14px"><button class="btn" data-action="closeCompany">${H.i('arrow-left')} All companies</button><div class="spacer"></div><button class="btn btn-danger btn-sm" data-action="delCompany" data-id="${c.id}">${H.i('trash-2')} Remove workspace</button></div>
  <div class="card" style="margin-bottom:16px"><div class="hero-row" style="gap:16px"><span class="monogram" style="background:${U.esc(c.color)};width:56px;height:56px;font-size:1.2rem">${U.esc(c.mono)}</span><div style="flex:1;min-width:200px"><h1>${U.esc(c.name)}</h1><p class="muted">Readiness ${r}% (ticked checklist items)</p></div>${H.ring(r, 88, 8)}</div>
    ${c.note ? `<div class="callout" style="margin-top:12px">${H.i('info')}<div><b>General guidance (verify for your role):</b> ${U.esc(c.note)}</div></div>` : ''}</div>
  <div class="grid g2">${Object.keys(CHECKLIST).map(k => `<div class="card"><div class="card-head"><h3>${U.esc(CHECK_LABELS[k])}</h3><span class="badge">${Company.catPct(c, k)}%</span></div><div class="list">${CHECKLIST[k].map((it, i) => `<label class="check"><input type="checkbox" data-change="coCheck" data-id="${c.id}" data-key="${k}:${i}" ${c.checks && c.checks[k + ':' + i] ? 'checked' : ''}> ${U.esc(it)}</label>`).join('')}</div></div>`).join('')}
    <div class="card"><div class="card-head"><h3>${H.i('notebook-pen')} Personal notes</h3></div><textarea id="conote-${c.id}" data-input="coNote" data-id="${c.id}" rows="7" maxlength="5000" placeholder="Team, recruiter feedback, what to emphasise…">${U.esc(c.notes || '')}</textarea><p class="muted tiny">Saved automatically.</p></div>
    <div class="card"><div class="card-head"><h3>${H.i('briefcase')} Applications & stages</h3><button class="btn btn-sm" data-action="newJob" data-company="${U.esc(c.name)}">${H.i('plus')} Add</button></div>${apps.length ? `<div class="list">${apps.map(j => `<div class="item"><div class="item-body"><div class="item-title">${U.esc(j.role)}</div><div class="item-meta"><span class="badge b-primary">${U.esc(j.stage)}</span>${j.followUp ? 'Follow-up ' + U.fmtShort(j.followUp) : ''}</div></div></div>`).join('')}</div>` : '<p class="muted small">No applications tracked for this company.</p>'}</div>
    <div class="card"><div class="card-head"><h3>${H.i('mic')} Mock interview results</h3><button class="btn btn-sm" data-action="logMock" data-company="${U.esc(c.name)}">${H.i('plus')} Log</button></div>${mocks.length ? `<div class="list">${mocks.map(m => `<div class="kv"><span>${U.fmt(m.date)} · ${U.esc(m.type)}</span><b>${Mocks.avg(m).toFixed(1)} / 5</b></div>`).join('')}</div>` : '<p class="muted small">No mocks tagged with this company yet.</p>'}</div>
    <div class="card"><div class="card-head"><h3>${H.i('message-square-quote')} STAR template</h3></div><pre class="text small">${U.esc(STAR_TEMPLATE)}</pre><div class="section-label">Example shape (replace with your real story)</div><pre class="text small muted">${U.esc(STAR_EXAMPLE)}</pre></div>
  </div>`;
};

/* ---------- 12. Mock interviews ---------- */
Views.mocks = () => {
  const s = Store.s; const tm = Timers.get('mock'); const ms = s.mocks.slice().sort((a, b) => b.date.localeCompare(a.date));
  if (ms.length > 1) After.push(() => { const c = Charts.colors(); const asc = ms.slice().reverse(); Charts.make('chMock', { type: 'line', data: { labels: asc.map(m => U.fmtShort(m.date)), datasets: [{ label: 'Average (/5)', data: asc.map(m => +Mocks.avg(m).toFixed(2)), borderColor: c.p, backgroundColor: c.p, tension: .3 }] }, options: { scales: { y: { min: 0, max: 5 } } } }); });
  return H.head('Mock Interviews', 'Run timed sessions, then score yourself (or record your interviewer\'s scores). The browser cannot judge your performance — every score here is entered by you.', `<button class="btn" data-action="logMock">${H.i('plus')} Log a past session</button>`) + `
  <div class="grid g2" style="margin-bottom:16px">
    <div class="card"><div class="card-head"><h2>${H.i('timer')} Timed session</h2></div>
      ${tm ? `<div class="callout ok" style="margin-bottom:12px">${H.i('mic')}<div><b>${U.esc(tm.type)}</b>${tm.company ? ' · ' + U.esc(tm.company) : ''} — target ${tm.target} min<br>Prompt: ${U.esc(tm.prompt)}</div></div>
        <div class="btn-row"><span class="timer" data-timer="mock">${U.secs(Timers.elapsed('mock'))}</span><button class="btn btn-primary" data-action="mockFinish">${H.i('square')} Finish & score</button><button class="btn btn-ghost" data-action="mockCancel">Cancel</button></div>`
      : `<form data-form="mockStart" class="form-grid">
        ${H.field('Session type', `<select name="type">${H.opts(MOCK_TYPES, 'Coding')}</select>`)}
        ${H.field('Company (optional)', `<select name="company">${H.opts(s.companies.map(c => c.name), '', 'General')}</select>`)}
        ${H.field('Target minutes', '<input type="number" name="target" min="10" max="180" value="45">', false, 'target')}
        <div class="fl" style="justify-content:flex-end"><button class="btn btn-primary" type="submit">${H.i('play')} Start session</button></div>
        <p class="muted small full">A practice prompt is picked from this app's question banks.</p></form>`}
    </div>
    <div class="card"><div class="card-head"><h2>${H.i('chart-line')} Score trend</h2></div>${ms.length > 1 ? '<div class="chart-box"><canvas id="chMock" aria-label="Mock score trend"></canvas></div>' : H.empty('chart-line', 'Not enough data', 'Record two or more scored sessions to see your trend.')}</div>
  </div>
  <div class="card" style="margin-bottom:16px"><div class="card-head"><h2>${H.i('history')} Sessions</h2><button class="btn btn-sm" data-action="exportCsv" data-what="mocks" ${ms.length ? '' : 'disabled'}>${H.i('download')} CSV</button></div>
    ${ms.length ? `<div class="list">${ms.map(m => `<div class="item"><div class="item-body"><div class="item-title">${U.esc(m.type)}${m.company ? ' · ' + U.esc(m.company) : ''} — ${Mocks.avg(m).toFixed(1)} / 5</div><div class="item-meta">${U.fmt(m.date)} · ${m.duration} min${m.prompt ? ' · ' + U.esc(m.prompt) : ''}</div>${m.feedback ? `<pre class="text small muted">${U.esc(m.feedback)}</pre>` : ''}</div><div class="item-actions"><button class="btn btn-icon btn-sm btn-ghost" data-action="editMock" data-id="${m.id}" aria-label="Edit session">${H.i('pencil')}</button><button class="btn btn-icon btn-sm btn-ghost" data-action="delMock" data-id="${m.id}" aria-label="Delete session" style="color:var(--danger)">${H.i('trash-2')}</button></div></div>`).join('')}</div>`
      : H.empty('mic', 'No sessions yet', 'Start a timed session above or log one you did with a friend or on a platform.')}</div>
  <div class="grid g2"><div class="card"><div class="card-head"><h2>${H.i('message-square-quote')} STAR answer template</h2></div><pre class="text">${U.esc(STAR_TEMPLATE)}</pre><div class="section-label">Example shape</div><pre class="text small muted">${U.esc(STAR_EXAMPLE)}</pre></div>
    <div class="card"><div class="card-head"><h2>${H.i('users')} Behavioural prompts to prepare</h2></div>${H.list(BEHAVIORAL_PROMPTS)}<p class="muted small">Prepare stories about: a production incident, a security fix, mentoring, a disagreement, a failure, and your biggest technical win.</p></div></div>`;
};
Views.mockForm = (m, pre) => {
  const isNew = !m; m = m || Object.assign({ date: U.today(), type: 'Coding', company: '', duration: 45, prompt: '', scores: {}, feedback: '' }, pre || {});
